<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المشوار | خدمات</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><div class="hero"><h1>📍 متابعة المشوار</h1><p class="muted">الموقع المباشر والمسار الحقيقي على الطرق.</p></div><div id="share" class="card">جارٍ تحميل الموقع...</div></main><script type="module">
const e=document.getElementById('share'),t=new URLSearchParams(location.search).get('token');let map=null,routeLine=null,trackLine=null,marker=null,destinationMarker=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function ensureMap(){if(window.L)return window.L;return await new Promise((resolve,reject)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>resolve(window.L);s.onerror=reject;document.body.appendChild(s);});}
function mapsUrl(a,b){if(!a)return '';const from=`${a.lat},${a.lng}`;const to=b?`${b.lat},${b.lng}`:from;return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=driving`;}
async function load(){try{const r=await fetch('/api/v1/shared-trips/'+encodeURIComponent(t||''));const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'الرابط غير صالح');const h=Array.isArray(j.history)?j.history:[],track=h.map(x=>[Number(x.lat),Number(x.lng)]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));const live=j.location&&Number.isFinite(Number(j.location.lat))?[Number(j.location.lat),Number(j.location.lng)]:null;const current=live||track[track.length-1]||null;const destination=j.destination&&Number.isFinite(Number(j.destination.lat))?[Number(j.destination.lat),Number(j.destination.lng)]:null;e.innerHTML='<h2>'+esc(j.code)+'</h2><p>الحالة: <b>'+esc(j.status)+'</b></p>'+(j.provider?'<p>مقدم الخدمة: '+esc(j.provider.displayName)+(j.provider.verified?' ✓':'')+'</p>':'')+'<div class="row" style="margin:10px 0;gap:8px;flex-wrap:wrap">'+(current?'<a class="btn" target="_blank" rel="noopener" href="'+esc(mapsUrl(current,destination))+'">🗺️ فتح المسار في الخرائط</a>':'')+'<span class="status">'+(j.location?'📡 الموقع مباشر':'📍 آخر موقع مسجل')+'</span></div><div id="sharedMap" style="height:380px;border-radius:12px;overflow:hidden;margin-top:12px"></div>'+(j.location?'<p class="muted">آخر تحديث: '+new Date(j.location.updatedAt).toLocaleString('ar-YE')+' · يتحدث تلقائيًا</p>':'<p class="muted">بانتظار موقع GPS حي.</p>');const L=await ensureMap(),el=document.getElementById('sharedMap');if(!map){map=L.map(el,{scrollWheelZoom:false}).setView(current||destination||[15.55,48.52],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);routeLine=L.polyline([],{weight:7,opacity:.9}).addTo(map);trackLine=L.polyline([],{weight:4,opacity:.55,dashArray:'8 8'}).addTo(map);marker=current?L.marker(current).addTo(map).bindPopup('📡 الموقع الحالي').openPopup():null;destinationMarker=destination?L.marker(destination).addTo(map).bindPopup('🎯 الوجهة'):null;}else{if(marker&&current)marker.setLatLng(current);if(destinationMarker&&destination)destinationMarker.setLatLng(destination);}
trackLine.setLatLngs(track);if(track.length>1)trackLine.setLatLngs(track);if(destination&&destinationMarker)destinationMarker.setLatLng(destination);
try{const rr=await fetch('/api/v1/shared-trips/'+encodeURIComponent(t||'')+'/route');const rj=await rr.json();const coords=(rj.coordinates||[]).map(x=>[Number(x[1]),Number(x[0])]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));routeLine.setLatLngs(coords);if(coords.length>1)map.fitBounds(L.latLngBounds(coords),{padding:[28,28],maxZoom:17});else if(current)map.setView(current,16);}catch{if(track.length>1)routeLine.setLatLngs(track);}
setTimeout(()=>map.invalidateSize(),100);}catch(x){e.innerHTML='<p class="error">'+esc(x.message||x)+'</p>';}}
load();setInterval(load,7000);
</script></body></html>
